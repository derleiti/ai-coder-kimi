name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Compile Python sources
        run: python -m compileall -q aicoder tests
      - name: Critical Ruff checks
        run: ruff check aicoder tests --select E9,F63,F7,F82
      - name: Tests
        run: |
          QT_QPA_PLATFORM=offscreen python -m pytest -q
